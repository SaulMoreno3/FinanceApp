services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      JWT_SECRET: ${JWT_SECRET}
      PEPPER: ${PEPPER}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      EODHD_API_KEY: ${EODHD_API_KEY:-}
      TRUELAYER_CLIENT_ID: ${TRUELAYER_CLIENT_ID:-}
      TRUELAYER_CLIENT_SECRET: ${TRUELAYER_CLIENT_SECRET:-}
      TRUELAYER_REDIRECT_URI: ${TRUELAYER_REDIRECT_URI:-https://finance.saulmoreno.es/api/bank-sync/truelayer/callback}
      TRUELAYER_PROVIDER_ID: ${TRUELAYER_PROVIDER_ID:-}
      TRUELAYER_AUTH_URL: ${TRUELAYER_AUTH_URL:-https://auth.truelayer.com}
      TRUELAYER_API_URL: ${TRUELAYER_API_URL:-https://api.truelayer.com}
      WEB_APP_URL: ${WEB_APP_URL:-https://finance.saulmoreno.es}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://finance.saulmoreno.es,http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - ./data/uploads:/app/uploads
      # pnpm runs the API from /app/apps/api; persist new and legacy absolute paths.
      - ./data/uploads:/app/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "pnpm --filter api db:migrate && pnpm --filter api exec tsx dist/index.js"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-127.0.0.1:8080}:80"
    networks:
      - default
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=saulmoreno_web
      - traefik.http.routers.finance.rule=Host(`finance.saulmoreno.es`)
      - traefik.http.routers.finance.entrypoints=websecure
      - traefik.http.routers.finance.tls=true
      - traefik.http.routers.finance.tls.certresolver=letsencrypt
      - traefik.http.services.finance.loadbalancer.server.port=80
    depends_on:
      - api

networks:
  web:
    external: true
    name: saulmoreno_web
